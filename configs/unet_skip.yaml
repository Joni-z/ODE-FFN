# Scheme A: U-Net-style long skip connections (U-ViT / MDTv2 recipe)
# Encoder blocks 0-5 save skip features; decoder blocks 6-11 receive them
# via Linear(2d, d) projections zero-initialized to [I | 0] (main branch pass-through).
train:
  exp_name: "unet_skip"
  seed: 42

  epochs: 80
  warmup_epochs: 1

  per_device_batch_size: 256
  num_workers: 16
  pin_mem: true
  prefetch_factor: 4
  device_prefetch: true

  lr: null
  blr: 1.0e-4
  beta2: 0.99
  weight_decay: 0.0

  lr_schedule: "constant"
  min_lr: 0.0

  ema_decay: 0.9999

  log_every: 100
  save_every: 2
  eval_every: 2

  mixed_precision: "bf16"

data:
  data_path: "/projects/work/public/ml-datasets/imagenet"
  img_size: 256
  class_num: 1000

model:
  name: "JiT-B/16"
  ffn_type: "swiglu"
  attn_dropout: 0.0
  proj_dropout: 0.0
  topology_kwargs:
    long_shortcuts: true

diffusion:
  P_mean: -0.8
  P_std: 0.8
  noise_scale: 1.0
  t_eps: 5.0e-2
  label_drop_prob: 0.1

sample:
  tmp_dir: "/scratch/zz5070/ODE_FFN/jit-codebase/tmp"
  sampling_method: "heun"
  num_sampling_steps: 50
  cfg: 2.9
  interval_min: 0.1
  interval_max: 1.0
  num_images: 5000
  gen_bsz: 128
  eval_online: true
  fid_stats_256: "fid_stats/jit_in256_stats.npz"
  fid_stats_512: "fid_stats/jit_in512_stats.npz"

checkpointing:
  out_dir: "/scratch/zz5070/ODE_FFN/jit-codebase/results"
  resume: ""

logging:
  project: "jit-training"
  run_name: "unet_skip"
